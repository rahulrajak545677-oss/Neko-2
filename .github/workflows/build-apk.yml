name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unzip the project
        run: unzip -oq NekoAI*.zip

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        run: |
          cd "$(dirname "$(find . -name settings.gradle.kts -print -quit)")"
          gradle assembleDebug --stacktrace
          cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/NekoAI-debug.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: NekoAI-debug-apk
          path: NekoAI-debug.apk
